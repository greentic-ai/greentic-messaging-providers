provider_id: webchat
version: 1
title: Webchat provider setup
questions:
  - name: public_base_url
    title: Public base URL
    kind: string
    required: true
    help: "Example: https://xxxx.trycloudflare.com"
    validate:
      regex: "^https://"
  - name: mode
    title: Mode
    kind: enum
    choices:
      - local_queue
      - websocket
      - pubsub
    required: true
    default: "local_queue"
    help: "Delivery mode used by the runner"
  - name: route
    title: Route
    kind: string
    required: false
    default: "webchat"
    help: "Routing key for outbound messages. Either this or Tenant channel ID must be set."
  - name: tenant_channel_id
    title: Tenant channel ID
    kind: string
    required: false
    help: "Tenant-scoped channel identifier. An alternative to Route."
  - name: base_url
    title: Base URL
    kind: string
    required: false
    help: "DirectLine or WebChat server base URL"
    validate:
      regex: "^https?://"
