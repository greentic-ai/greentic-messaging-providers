name: E2E Dry-Run Providers

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  GREENTIC_ENV: dev
  GREENTIC_TENANT: ci
  GREENTIC_TEAM: ci

jobs:
  e2e-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e-dry-run

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-component
        run: cargo binstall cargo-component --version 0.21.1 --force --no-confirm --locked || cargo install cargo-component --version 0.21.1 --force --locked

      - name: Install greentic-pack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo binstall greentic-pack --force --no-confirm --locked || cargo install greentic-pack --force --locked

      - name: Install greentic-flow
        run: cargo binstall greentic-flow --force --no-confirm --locked || cargo install greentic-flow --force --locked

      - name: Install greentic-runner
        run: cargo binstall greentic-runner --force --no-confirm --locked || cargo install greentic-runner --force --locked

      - name: Install greentic-component
        run: cargo binstall greentic-component --force --no-confirm --locked || cargo install greentic-component --force --locked

      - name: Install b3sum
        run: cargo binstall b3sum --force --no-confirm --locked || cargo install b3sum --force --locked

      - name: Build components
        run: ./tools/build_components_parallel.sh

      # Packgen flow generation disabled - v0.6.0 uses component-based QA
      # Legacy flows (setup_default, update, remove, requirements) removed

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sync packs
        run: ./tools/sync_packs.sh

      # Flow validation skipped - v0.6.0 flows only use built-in render_text nodes
      # Legacy sidecar files (.resolve.json) were removed as part of v0.6.0 refactor

      - name: Update manifest hashes
        run: |
          # CI rebuilds wasm from source, so update manifest hashes to match actual builds
          shopt -s nullglob globstar
          for manifest in packs/*/components/**/component.manifest.json; do
            # Skip v0.6.0 QA contract manifests (they don't have hashes field)
            case "$manifest" in
              */messaging-provider-*/component.manifest.json|*/messaging-ingress-*/component.manifest.json|*/state-provider-*/component.manifest.json|*/secrets-probe/component.manifest.json)
                continue
                ;;
            esac
            python3 - "$manifest" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          if not manifest_path.exists():
              sys.exit(0)

          data = json.loads(manifest_path.read_text())
          if "hashes" not in data or "artifacts" not in data:
              sys.exit(0)

          manifest_dir = manifest_path.parent
          updated = False
          for artifact_key, wasm_rel in data.get("artifacts", {}).items():
              wasm_path = manifest_dir / wasm_rel
              if wasm_path.exists() and artifact_key in data.get("hashes", {}):
                  result = subprocess.run(
                      ["b3sum", "--no-names", str(wasm_path)],
                      capture_output=True, text=True
                  )
                  if result.returncode == 0:
                      new_hash = f"blake3:{result.stdout.strip()}"
                      if data["hashes"][artifact_key] != new_hash:
                          data["hashes"][artifact_key] = new_hash
                          updated = True

          if updated:
              manifest_path.write_text(json.dumps(data, indent=2) + "\n")
              print(f"Updated hashes in {manifest_path}")
          PY
          done

      - name: Validate components
        run: |
          # Find component manifests in subdirectories
          # Skip manifests that don't work with greentic-component doctor:
          # - provider/ingress: v0.6.0 QA contract schema (no artifacts/hashes/describe_export)
          # - templates/provision/qa: embedded manifest not available in CI-built wasm
          shopt -s nullglob globstar
          for c in packs/*/components/**/component.manifest.json; do
            case "$c" in
              */messaging-provider-*/component.manifest.json|*/messaging-ingress-*/component.manifest.json|*/state-provider-*/component.manifest.json|*/secrets-probe/component.manifest.json|*/templates/component.manifest.json|*/provision/component.manifest.json|*/qa/component.manifest.json)
                echo "Skipping manifest: $c"
                ;;
              *)
                greentic-component doctor "$c"
                ;;
            esac
          done

      - name: Test component-questions
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          cp components/questions/questions.wasm "${tmpdir}/questions.wasm"
          cp components/questions/component.manifest.json "${tmpdir}/component.manifest.json"
          cp packs/messaging-dummy/assets/setup.yaml "${tmpdir}/setup.yaml"
          (
            cd "${tmpdir}"
            greentic-component test \
              --wasm questions.wasm \
              --manifest component.manifest.json \
              --op emit \
              --input-json '{"id":"dummy-setup","spec_ref":"assets/setup.yaml","context":{"tenant_id":"t1","env":"dev"}}'
          )
          python3 - <<'PY' "${tmpdir}"
          import json
          import sys
          from pathlib import Path

          tmpdir = Path(sys.argv[1])
          spec = {
              "provider_id": "dummy",
              "version": 1,
              "title": "Dummy provider setup",
              "questions": [],
              "id": "dummy-setup",
          }
          payload = {
              "id": "dummy-setup",
              "spec_json": json.dumps(spec),
              "answers_json": json.dumps({}),
          }
          (tmpdir / "validate_input.json").write_text(json.dumps(payload))
          PY
          (
            cd "${tmpdir}"
            greentic-component test \
              --wasm questions.wasm \
              --manifest component.manifest.json \
              --op validate \
              --input validate_input.json
          )

      - name: Build packs (dry run)
        env:
          DRY_RUN: "1"
        run: ./tools/publish_packs_oci.sh
