name: Build, Test, and Publish Packs

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OCI_REGISTRY: ghcr.io
  OCI_NAMESPACE: ${{ github.repository_owner }}/greentic-messaging-providers

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_all: ${{ steps.detect.outputs.build_all }}
      reason: ${{ steps.detect.outputs.reason }}
      affected_providers: ${{ steps.detect.outputs.affected_providers }}
      affected_components: ${{ steps.detect.outputs.affected_components }}
      affected_components_csv: ${{ steps.detect.outputs.affected_components_csv }}
      affected_packs: ${{ steps.detect.outputs.affected_packs }}
      affected_packs_csv: ${{ steps.detect.outputs.affected_packs_csv }}
      affected_manifests: ${{ steps.detect.outputs.affected_manifests }}
      targeted_manifests_json: ${{ steps.detect.outputs.targeted_manifests_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected providers and packs
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          full_result() {
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix = json.loads(Path("ci/provider-matrix.json").read_text())
          components = list(dict.fromkeys(
              component
              for provider in matrix["providers"].values()
              for component in provider["components"]
          ))
          packs = list(dict.fromkeys(
              provider["pack"]
              for provider in matrix["providers"].values()
          ))
          manifests = sorted({
              manifest
              for provider in matrix["providers"].values()
              for manifest in provider["manifests"]
          })
          print(json.dumps({
              "build_all": True,
              "reason": "manual or tag run",
              "changed_files": [],
              "affected_providers": sorted(matrix["providers"].keys()),
              "affected_components": components,
              "affected_packs": packs,
              "affected_manifests": manifests,
          }))
          PY
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            result="$(full_result)"
          else
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              base_sha="${PR_BASE_SHA}"
            else
              base_sha="${PUSH_BEFORE}"
            fi
            if [ -z "${base_sha}" ] || [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
              result="$(full_result)"
            else
              result="$(python3 ci/provider_matrix.py detect-changes --base "${base_sha}" --head "${GITHUB_SHA}")"
            fi
          fi

          RESULT_JSON="${result}" python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT_JSON"])
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          affected_components = json.dumps(result["affected_components"])
          affected_packs = json.dumps(result["affected_packs"])
          affected_manifests = json.dumps(result["affected_manifests"])
          affected_providers = json.dumps(result["affected_providers"])
          targeted_manifests_json = "" if result["build_all"] else affected_manifests
          affected_components_csv = ",".join(result["affected_components"])
          affected_packs_csv = ",".join(result["affected_packs"])

          with open(output_path, "a", encoding="utf-8") as handle:
            handle.write(f"build_all={'true' if result['build_all'] else 'false'}\n")
            handle.write(f"reason={result['reason']}\n")
            handle.write(f"affected_providers={affected_providers}\n")
            handle.write(f"affected_components={affected_components}\n")
            handle.write(f"affected_components_csv={affected_components_csv}\n")
            handle.write(f"affected_packs={affected_packs}\n")
            handle.write(f"affected_packs_csv={affected_packs_csv}\n")
            handle.write(f"affected_manifests={affected_manifests}\n")
            handle.write(f"targeted_manifests_json={targeted_manifests_json}\n")

          providers = ", ".join(result["affected_providers"])
          components = ", ".join(result["affected_components"])
          packs = ", ".join(result["affected_packs"])
          changed_files = "\n".join(f"- `{path}`" for path in result.get("changed_files", []))
          if not changed_files:
            changed_files = "- manual or tag-triggered full run"

          with open(summary_path, "a", encoding="utf-8") as handle:
            handle.write("## Change Detection\n")
            handle.write(f"- `build_all`: `{str(result['build_all']).lower()}`\n")
            handle.write(f"- reason: `{result['reason']}`\n")
            handle.write(f"- providers: {providers}\n")
            handle.write(f"- components: {components}\n")
            handle.write(f"- packs: {packs}\n\n")
            handle.write("### Changed Files\n")
            handle.write(f"{changed_files}\n")
          PY

  fmt:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Step 01 - Cargo fmt
        env:
          COMPONENT_MANIFESTS_JSON: ${{ needs.detect-changes.outputs.targeted_manifests_json }}
        run: ./ci/steps/01_fmt.sh

  clippy:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Step 02 - Cargo clippy
        env:
          COMPONENT_MANIFESTS_JSON: ${{ needs.detect-changes.outputs.targeted_manifests_json }}
        run: ./ci/steps/02_clippy.sh

  check-op-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Step 05 - Check component operation schemas
        run: ./ci/steps/05_check_op_schemas.sh

  build-components:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect-changes.outputs.affected_components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-component
        run: |
          cargo binstall cargo-component --version 0.21.1 --force --no-confirm --locked || cargo install cargo-component --version 0.21.1 --force --locked

      - name: Cache component wasm
        id: cache-component
        uses: actions/cache@v4
        with:
          path: target/components/${{ matrix.component }}.wasm
          key: component-wasm-${{ matrix.component }}-${{ runner.os }}-${{ hashFiles('components/**', 'crates/**', 'wit/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/build_component_env.sh', 'tools/build_component_one.sh', 'tools/build_components/**') }}

      - name: Step 03 - Build components
        if: steps.cache-component.outputs.cache-hit != 'true'
        run: bash "./tools/build_components/${{ matrix.component }}.sh"

      - name: Upload component artifacts
        uses: actions/upload-artifact@v4
        with:
          name: components-wasm-${{ matrix.component }}
          path: target/components/${{ matrix.component }}.wasm
          if-no-files-found: error

  ensure-templates:
    runs-on: ubuntu-latest
    needs: build-components
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Step 04 - Ensure templates are staged in packs
        run: ./ci/steps/04_ensure_templates.sh

      - name: Upload templates artifact
        uses: actions/upload-artifact@v4
        with:
          name: component-templates-local
          path: |
            target/components/templates.wasm
            target/components/ai.greentic.component-templates.wasm
          if-no-files-found: error

  gen-flows:
    runs-on: ubuntu-latest
    needs: [ensure-templates, build-components]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Download templates artifact
        uses: actions/download-artifact@v4
        with:
          name: component-templates-local
          path: target/components

      - name: Step 06 - Generate flows
        run: ./ci/steps/06_gen_flows.sh

  sync-packs:
    runs-on: ubuntu-latest
    needs: validate-pack-inputs
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Download templates artifact
        uses: actions/download-artifact@v4
        with:
          name: component-templates-local
          path: target/components

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Step 07 - Sync packs
        run: ./ci/steps/07_sync_packs.sh

  validate-pack-inputs:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-components, ensure-templates, gen-flows]
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJson(needs.detect-changes.outputs.affected_packs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-pack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo binstall greentic-pack --force --no-confirm --locked || cargo install greentic-pack --force --locked
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          greentic-pack --version

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Download templates artifact
        uses: actions/download-artifact@v4
        with:
          name: component-templates-local
          path: target/components

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Step 07a - Validate pack inputs early
        env:
          PACK_FILTER: ${{ matrix.pack }}
        run: ./ci/steps/07a_validate_pack_inputs.sh

      - name: Upload early pack validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: early-pack-validation-report-${{ matrix.pack }}
          path: |
            dist/packs/*.gtpack
            dist/pack_validation_report.json
            dist/pack_validation.log
            packs.lock.json
          if-no-files-found: ignore

  flow-doctor:
    runs-on: ubuntu-latest
    needs: sync-packs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-flow
        run: |
          cargo binstall greentic-flow --force --no-confirm --locked || cargo install greentic-flow --force --locked

      - name: Step 08 - Flow doctor
        run: ./ci/steps/08_flow_doctor.sh

  component-doctor:
    runs-on: ubuntu-latest
    needs: sync-packs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-component
        run: |
          cargo binstall greentic-component --force --no-confirm --locked || cargo install greentic-component --force --locked

      - name: Step 09 - Component doctor
        run: ./ci/steps/09_component_doctor.sh

  questions-component-test:
    runs-on: ubuntu-latest
    needs: sync-packs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-component
        run: |
          cargo binstall greentic-component --force --no-confirm --locked || cargo install greentic-component --force --locked

      - name: Step 10 - Questions component tests
        run: ./ci/steps/10_questions_component_test.sh

  build-packs:
    runs-on: ubuntu-latest
    needs: [detect-changes, sync-packs, flow-doctor, component-doctor, questions-component-test]
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJson(needs.detect-changes.outputs.affected_packs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-pack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo binstall greentic-pack --force --no-confirm --locked || cargo install greentic-pack --force --locked
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          greentic-pack --version

      - name: Install greentic-flow
        run: |
          cargo binstall greentic-flow --force --no-confirm --locked || cargo install greentic-flow --force --locked

      - name: Install greentic-runner
        run: |
          cargo binstall greentic-runner --force --no-confirm --locked || cargo install greentic-runner --force --locked

      - name: Install greentic-component
        run: |
          cargo binstall greentic-component --force --no-confirm --locked || cargo install greentic-component --force --locked

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Download templates artifact
        uses: actions/download-artifact@v4
        with:
          name: component-templates-local
          path: target/components

      - name: Step 11 - Build packs
        env:
          PACK_FILTER: ${{ matrix.pack }}
        run: ./ci/steps/11_build_packs.sh

      - name: Upload packs + fixtures report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packs-and-fixtures-${{ matrix.pack }}
          path: |
            dist/packs/*.gtpack
            dist/fixtures_report.json
          if-no-files-found: error

      - name: Upload built pack artifact (dry-run)
        uses: actions/upload-artifact@v4
        with:
          name: gtpack-dryrun-${{ matrix.pack }}
          path: dist/packs/${{ matrix.pack }}.gtpack
          if-no-files-found: ignore

  cargo-test:
    runs-on: ubuntu-latest
    needs: build-components
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-component
        run: |
          cargo binstall cargo-component --version 0.21.1 --force --no-confirm --locked || cargo install cargo-component --version 0.21.1 --force --locked

      - name: Install greentic-flow
        run: |
          cargo binstall greentic-flow --force --no-confirm --locked || cargo install greentic-flow --force --locked

      - name: Install greentic-pack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo binstall greentic-pack --force --no-confirm --locked || cargo install greentic-pack --force --locked
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          greentic-pack --version

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Step 12 - Cargo tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "-C debuginfo=0"
          RUST_BACKTRACE: "1"
        run: ./ci/steps/12_cargo_test.sh

      - name: Upload CI-generated registry fixtures on failure
        # `assert_fixture_stable` drops diverging bytes next to the committed
        # fixtures as `*.cbor.ci-generated` when it trips. Capturing them as
        # an artifact lets us compare local vs CI-produced describe output
        # without round-tripping another debug commit.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registry-fixtures-ci-generated
          path: tests/fixtures/registry/**/*.cbor.ci-generated
          if-no-files-found: ignore

  publish:
    runs-on: ubuntu-latest
    needs: [detect-changes, fmt, clippy, check-op-schemas, build-packs, cargo-test]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-test-publish

      - name: Cache cargo bin tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
          key: cargo-bin-tools-${{ runner.os }}-v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install greentic-pack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo binstall greentic-pack --force --no-confirm --locked || cargo install greentic-pack --force --locked
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          greentic-pack --version

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: components-wasm-*
          path: target/components
          merge-multiple: true

      - name: Download templates artifact
        uses: actions/download-artifact@v4
        with:
          name: component-templates-local
          path: target/components

      - name: Set publish version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("Cargo.toml").read_text())
          version = data["workspace"]["package"]["version"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"PUBLISH_VERSION={version}\n")
          print(f"Using Cargo workspace version: {version}")
          PY

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish components
        env:
          VERSION: ${{ env.PUBLISH_VERSION }}
          PUBLISH_LATEST: "1"
          COMPONENT_FILTER: ${{ needs.detect-changes.outputs.affected_components_csv }}
        run: bash ./tools/publish_oci.sh

      - name: Upload components lockfile
        uses: actions/upload-artifact@v4
        with:
          name: components-lockfile
          path: components.lock.json
          if-no-files-found: error

      - name: Resolve templates OCI digest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          templates_ref = "ghcr.io/greenticai/components/templates:latest"
          templates_digest = ""
          lock_path = Path("components.lock.json")
          if lock_path.exists():
            lock = json.loads(lock_path.read_text())
            templates = next(
                (entry for entry in lock.get("components", []) if entry.get("name") == "templates"),
                None,
            )
            if templates:
              templates_ref = templates["reference"]
              templates_digest = templates["digest"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"TEMPLATES_IMAGE={templates_ref}\n")
            handle.write(f"TEMPLATES_DIGEST={templates_digest}\n")

          print(f"Using templates reference: {templates_ref}@{templates_digest or 'latest'}")
          PY

      - name: Publish packs
        env:
          PACK_VERSION: ${{ env.PUBLISH_VERSION }}
          PUBLISH_LATEST: "1"
          PACK_FILTER: ${{ needs.detect-changes.outputs.affected_packs_csv }}
          TEMPLATES_IMAGE: ${{ env.TEMPLATES_IMAGE }}
          TEMPLATES_DIGEST: ${{ env.TEMPLATES_DIGEST }}
        run: ./tools/publish_packs_oci.sh

      - name: Upload built packs
        uses: actions/upload-artifact@v4
        with:
          name: gtpack-artifacts
          path: dist/packs/*.gtpack
          if-no-files-found: error
