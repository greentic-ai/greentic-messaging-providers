[package]
name = "teams"
edition.workspace = true
version = "0.5.15"
license.workspace = true
publish = false

[package.metadata.component]
package = "provider:teams"

[package.metadata.component.target]
path = "wit/teams"
world = "component-v0-v6-v0"

[package.metadata.component.target.dependencies]
"greentic:interfaces-types" = { path = "wit/teams/deps/interfaces-types" }
"greentic:secrets-store" = { path = "wit/teams/deps/secrets-store" }
"greentic:http" = { path = "wit/teams/deps/http" }
"greentic:telemetry" = { path = "wit/teams/deps/telemetry" }

[lib]
crate-type = ["cdylib"]

[dependencies]
greentic-telemetry = { workspace = true }
provider-common = { package = "greentic-messaging-provider-common", path = "../../crates/provider-common" }
provider-runtime-config = { path = "../../crates/provider-runtime-config" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
urlencoding.workspace = true
wit-bindgen.workspace = true
