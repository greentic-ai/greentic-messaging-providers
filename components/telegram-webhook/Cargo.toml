[package]
name = "telegram-webhook"
edition.workspace = true
version = "0.5.3"
license.workspace = true
publish = false

[package.metadata.component]
package = "greentic:telegram-webhook"

[package.metadata.component.target]
path = "../../wit/component-node"
world = "node"

[package.metadata.component.target.dependencies]
"greentic:http" = { path = "wit/telegram-webhook/deps/http" }
"greentic:secrets-store" = { path = "wit/telegram-webhook/deps/secrets-store" }
"greentic:interfaces-types" = { path = "wit/telegram-webhook/deps/interfaces-types" }

[lib]
crate-type = ["cdylib"]

[dependencies]
greentic-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wit-bindgen.workspace = true
