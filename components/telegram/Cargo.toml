[package]
name = "telegram"
edition.workspace = true
version = "0.5.3"
license.workspace = true
publish = false

[package.metadata.component]
package = "provider:telegram"

[package.metadata.component.target]
path = "wit/telegram"
world = "component-v0-v6-v0"

[package.metadata.component.target.dependencies]
"greentic:interfaces-types" = { path = "wit/telegram/deps/interfaces-types" }
"greentic:secrets-store" = { path = "wit/telegram/deps/secrets-store" }
"greentic:http" = { path = "wit/telegram/deps/http" }
"greentic:telemetry" = { path = "wit/telegram/deps/telemetry" }

[lib]
crate-type = ["cdylib"]

[dependencies]
greentic-telemetry = { workspace = true }
htmlescape.workspace = true
provider-common = { package = "greentic-messaging-provider-common", path = "../../crates/provider-common" }
provider-runtime-config = { path = "../../crates/provider-runtime-config" }
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true
