[package]
name = "greentic-messaging-provider-common"
edition.workspace = true
version = "0.4.102"
license.workspace = true
description = "Shared provider DTOs, helpers, errors, QA bridges, and compatibility utilities for Greentic messaging providers"
repository = "https://github.com/greenticai/greentic-messaging-providers"
readme = "README.md"
keywords = ["greentic", "messaging", "provider", "webassembly", "wasm"]
categories = ["api-bindings", "wasm"]
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "MIGRATION.md",
    "src/**",
    "tests/**",
]

[lib]
name = "provider_common"

[features]
schema = ["schemars"]

[dependencies]
base64.workspace = true
ciborium.workspace = true
greentic-telemetry = { workspace = true }
greentic-types.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
glob.workspace = true
once_cell.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
